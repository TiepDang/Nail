<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Quản Trị Hệ Thống</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- ================= MÀN HÌNH ĐĂNG NHẬP (PIN) ================= -->
    <div id="login-screen" class="fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-lg shadow-xl w-96 text-center">
            <div class="mb-4 text-blue-600 text-4xl">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2 class="text-2xl font-bold mb-2 text-gray-800">Xác Thực Quản Trị</h2>
            <p class="text-sm text-gray-500 mb-6">Vui lòng nhập mã PIN hệ thống để tiếp tục</p>
            
            <form id="login-form" onsubmit="handleLogin(event)">
                <input type="password" id="pin-input" placeholder="Nhập mã PIN..." required
                    class="w-full px-4 py-2 border rounded-lg text-center text-xl tracking-widest focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4">
                <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition">
                    Đăng Nhập
                </button>
            </form>
        </div>
    </div>

    <!-- ================= GIAO DIỆN QUẢN TRỊ CHÍNH (Ẩn khi chưa đăng nhập) ================= -->
    <div id="admin-panel" class="hidden max-w-7xl mx-auto px-4 py-8">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800"><i class="fa-solid fa-gauge-high mr-2"></i> Quản Lý Dữ Liệu</h1>
            <button onclick="handleLogout()" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition">
                <i class="fa-solid fa-right-from-bracket mr-1"></i> Đăng Xuất
            </button>
        </div>

        <!-- Khu vực chứa bảng dữ liệu và chức năng (Thêm/Sửa/Xóa/Upload ImgBB) -->
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold text-gray-700">Danh Sách Sản Phẩm / Dữ Liệu</h2>
                <button onclick="fetchData()" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition text-sm">
                    <i class="fa-solid fa-rotate mr-1"></i> Làm Mới Dữ Liệu
                </button>
            </div>
            
            <!-- Bảng hiển thị dữ liệu động -->
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse" id="data-table">
                    <thead>
                        <tr class="bg-gray-200 text-gray-700 text-sm uppercase">
                            <th class="p-3 border">ID</th>
                            <th class="p-3 border">Tên</th>
                            <th class="p-3 border">Danh Mục</th>
                            <th class="p-3 border">Giá</th>
                            <th class="p-3 border">Ảnh (URL)</th>
                            <th class="p-3 border text-center">Hành Động</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="text-gray-600 text-sm">
                        <!-- Dữ liệu sẽ được load tự động vào đây -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ================= JAVASCRIPT XỬ LÝ LOGIC ================= -->
    <script>
        // ⚠️ THAY LINK WEB APP GOOGLE APPS SCRIPT CỦA BẠN VÀO ĐÂY
        const API_URL = "DÁN_LINK_WEB_APP_CỦA_BẠN_VÀO_ĐÂY"; 

        // Kiểm tra trạng thái đăng nhập sẵn có trong phiên trình duyệt
        window.onload = function() {
            if (sessionStorage.getItem('isAdminLoggedIn') === 'true') {
                unlockAdminPanel();
            }
        }

        // Xử lý gửi mã PIN lên Google Apps Script để kiểm tra bảo mật
        async function handleLogin(event) {
            event.preventDefault();
            const pinInput = document.getElementById('pin-input').value;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ 
                        action: 'login', 
                        password: pinInput // Khớp hoàn toàn với code Apps Script của bạn
                    })
                });
                
                const result = await response.json();

                if (result.status === 'success') {
                    sessionStorage.setItem('isAdminLoggedIn', 'true');
                    unlockAdminPanel();
                } else {
                    alert(result.message || 'Mã PIN không chính xác!');
                    document.getElementById('pin-input').value = '';
                }
            } catch (error) {
                console.error('Lỗi kết nối:', error);
                alert('Không thể kết nối đến máy chủ Google Apps Script.');
            }
        }

        function unlockAdminPanel() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('admin-panel').classList.remove('hidden');
            fetchData(); // Tải dữ liệu khi vào trang thành công
        }

        function handleLogout() {
            sessionStorage.removeItem('isAdminLoggedIn');
            location.reload(); // Tải lại trang để hiện lại màn hình nhập PIN
        }

        // Hàm gọi lấy dữ liệu từ Google Sheets thông qua Apps Script
        async function fetchData() {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'get' })
                });
                const data = await response.json();
                
                const tbody = document.getElementById('table-body');
                tbody.innerHTML = '';

                if (Array.isArray(data) && data.length > 0) {
                    data.forEach(item => {
                        let tr = document.createElement('tr');
                        tr.className = "border-b hover:bg-gray-50";
                        tr.innerHTML = `
                            <td class="p-3 border">${item.id || ''}</td>
                            <td class="p-3 border font-medium">${item.name || ''}</td>
                            <td class="p-3 border">${item.category || ''}</td>
                            <td class="p-3 border">${item.price || ''}</td>
                            <td class="p-3 border truncate max-w-xs">${item.images || item.img || ''}</td>
                            <td class="p-3 border text-center">
                                <span class="text-gray-400 italic">Đang hiển thị</span>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-gray-500">Chưa có dữ liệu trong bảng.</td></tr>`;
                }
            } catch (error) {
                console.error('Lỗi tải dữ liệu:', error);
            }
        }
    </script>
</body>
</html>
