<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Trị - Koprivnice CityNail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-pink-50 via-white to-pink-50 text-gray-800 min-h-screen flex flex-col justify-between">

    <!-- Header Admin -->
    <header class="bg-white/90 backdrop-blur-md shadow-sm sticky top-0 z-50 py-3">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">🔐</span>
                <h1 class="text-lg font-bold bg-gradient-to-r from-pink-600 to-rose-500 bg-clip-text text-transparent uppercase tracking-wider">Trang Quản Trị Studio</h1>
            </div>
            <div class="flex items-center space-x-3">
                <a href="index.html" class="text-xs font-semibold px-4 py-2 bg-pink-100 text-pink-700 rounded-full hover:bg-pink-200 transition">⬅ Xem Trang Chủ</a>
            </div>
        </div>
    </header>

    <!-- Main Content Admin -->
    <main class="container mx-auto px-4 py-6 flex-grow max-w-4xl">
        
        <!-- Form Thêm / Sửa Mẫu Móng -->
        <div class="bg-white rounded-2xl shadow-md border border-pink-100 p-6 mb-8">
            <h2 id="form-title" class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                <span>➕</span> Thêm Mẫu Móng Mới
            </h2>
            
            <form id="nail-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <input type="hidden" id="edit-id">
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Tên mẫu móng</label>
                        <input type="text" id="nail-name" required class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:outline-none focus:border-pink-500 text-sm" placeholder="VD: Gel Hồng Đính Đá">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Danh mục</label>
                        <select id="nail-category" class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:outline-none focus:border-pink-500 text-sm bg-white">
                            <option value="Manikúra">Manikúra</option>
                            <option value="Gelové nehty">Gelové nehty</option>
                            <option value="Nail Art">Nail Art</option>
                            <option value="Pedikúra">Pedikúra</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Giá bán (Kč)</label>
                        <input type="number" id="nail-price" required class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:outline-none focus:border-pink-500 text-sm" placeholder="VD: 600">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Giá cũ (Nếu có sale, để trống nếu không)</label>
                        <input type="number" id="nail-old-price" class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:outline-none focus:border-pink-500 text-sm" placeholder="VD: 800">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Chọn ảnh sản phẩm (Có thể chọn nhiều ảnh cùng lúc)</label>
                    <!-- ĐÃ THÊM THUỘC TÍNH multiple Ở ĐÂY -->
                    <input type="file" id="imageInput" accept="image/*" multiple class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-pink-50 file:text-pink-700 hover:file:bg-pink-100 cursor-pointer border border-gray-200 rounded-xl p-1">
                    <p class="text-[11px] text-gray-400 mt-1">💡 Mẹo: Giữ phím Ctrl (Windows) hoặc Cmd (Mac) để chọn nhiều ảnh cùng lúc.</p>
                </div>

                <!-- Khu vực hiển thị ảnh xem trước -->
                <div id="preview-container" class="flex flex-wrap gap-2 hidden"></div>

                <div class="flex items-center gap-3 pt-2">
                    <button type="submit" id="btn-save" class="flex-1 bg-pink-600 hover:bg-pink-700 text-white font-bold py-2.5 px-6 rounded-xl shadow transition text-sm">Lưu Sản Phẩm</button>
                    <button type="button" id="btn-cancel" onclick="resetForm()" class="hidden bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2.5 px-4 rounded-xl transition text-sm">Hủy</button>
                </div>
            </form>
        </div>

        <!-- Danh sách sản phẩm hiện tại -->
        <div class="bg-white rounded-2xl shadow-md border border-pink-100 p-6">
            <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center justify-between">
                <span>📋 Danh Sách Mẫu Móng Đã Đăng</span>
                <span id="total-count" class="text-xs font-semibold px-3 py-1 bg-pink-100 text-pink-700 rounded-full">0 mẫu</span>
            </h3>

            <div id="admin-product-list" class="space-y-3">
                <p class="text-gray-400 text-center py-10 text-sm">Đang tải danh sách...</p>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-pink-100 py-4 text-center text-xs text-gray-400">
        &copy; 2026 Koprivnice CityNail - Admin Panel
    </footer>

    <!-- Script Xử lý Admin -->
    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbzxcC8x3PAhtu-C_vR5Qxiv3LSRBZHLKAUvQSELPmhJOxqluAZ572ZcaNcuCO9m9dIP/exec';
        let allNails = [];
        let base64Images = []; // Mảng chứa các chuỗi base64 của nhiều ảnh được chọn

        // Xử lý sự kiện khi chọn file ảnh
        document.getElementById('imageInput').addEventListener('change', function(e) {
            const files = e.target.files;
            base64Images = [];
            const previewContainer = document.getElementById('preview-container');
            previewContainer.innerHTML = '';

            if (files && files.length > 0) {
                previewContainer.classList.remove('hidden');
                
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    const reader = new FileReader();
                    
                    reader.onload = function(uploadEvent) {
                        const base64String = uploadEvent.target.result;
                        base64Images.push(base64String);

                        // Hiển thị ảnh xem trước nhỏ
                        const imgThumb = document.createElement('div');
                        imgThumb.className = "relative w-16 h-16 rounded-lg overflow-hidden border border-gray-200 shadow-sm";
                        imgThumb.innerHTML = `<img src="${base64String}" class="w-full h-full object-cover">`;
                        previewContainer.appendChild(imgThumb);
                    };
                    
                    reader.readAsDataURL(file);
                }
            } else {
                previewContainer.classList.add('hidden');
            }
        });

        // Tải danh sách sản phẩm từ Google Sheets
        async function loadAdminNails() {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'get' })
                });
                allNails = await response.json();
                renderAdminList();
            } catch (error) {
                document.getElementById('admin-product-list').innerHTML = `<p class="text-rose-500 text-center text-sm">Không thể tải dữ liệu.</p>`;
            }
        }

        function renderAdminList() {
            const listContainer = document.getElementById('admin-product-list');
            document.getElementById('total-count').innerText = `${allNails.length} mẫu`;

            if (!allNails || allNails.length === 0) {
                listContainer.innerHTML = `<p class="text-gray-400 text-center py-10 text-sm">Chưa có mẫu móng nào.</p>`;
                return;
            }

            let html = '';
            allNails.forEach(n => {
                let imgList = [];
                if (n.images) {
                    try { imgList = typeof n.images === 'string' ? JSON.parse(n.images) : n.images; } catch(e){ imgList = [n.img]; }
                } else {
                    imgList = [n.img];
                }

                const firstImg = imgList[0] || '';

                html += `
                    <div class="flex items-center justify-between p-3 bg-gray-50 rounded-xl border border-gray-100 hover:border-pink-200 transition">
                        <div class="flex items-center space-x-3">
                            <img src="${firstImg}" class="w-12 h-12 object-cover rounded-lg border border-gray-200 shadow-sm flex-shrink-0">
                            <div>
                                <h4 class="font-bold text-sm text-gray-800">${n.name}</h4>
                                <p class="text-xs text-gray-500">Danh mục: <span class="font-medium text-pink-600">${n.category || 'Manikúra'}</span> | Giá: <span class="font-bold text-gray-700">${n.price} Kč</span> (${imgList.length} ảnh)</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button onclick="editNail('${n.id}')" class="px-3 py-1.5 bg-amber-100 text-amber-700 font-semibold rounded-lg text-xs hover:bg-amber-200 transition">Sửa</button>
                            <button onclick="deleteNail('${n.id}')" class="px-3 py-1.5 bg-rose-100 text-rose-700 font-semibold rounded-lg text-xs hover:bg-rose-200 transition">Xóa</button>
                        </div>
                    </div>
                `;
            });

            listContainer.innerHTML = html;
        }

        // Xử lý submit Form (Thêm hoặc Sửa)
        async function handleFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            const name = document.getElementById('nail-name').value;
            const category = document.getElementById('nail-category').value;
            const price = document.getElementById('nail-price').value;
            const oldPrice = document.getElementById('nail-old-price').value;

            // Kiểm tra nếu là thêm mới mà chưa chọn ảnh
            if (!id && base64Images.length === 0) {
                alert('Vui lòng chọn ít nhất một ảnh cho sản phẩm!');
                return;
            }

            const btnSave = document.getElementById('btn-save');
            btnSave.innerText = "Đang lưu...";
            btnSave.disabled = true;

            let payload = {
                action: id ? 'update' : 'add',
                id: id || Date.now().toString(),
                name: name,
                category: category,
                price: price,
                oldPrice: oldPrice
            };

            // Nếu có chọn ảnh mới thì cập nhật danh sách ảnh, nếu không giữ nguyên ảnh cũ khi sửa
            if (base64Images.length > 0) {
                payload.images = JSON.stringify(base64Images);
                payload.img = base64Images[0]; // Ảnh đại diện chính
            }

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                if(result.status === 'success' || result) {
                    alert('Lưu thành công!');
                    resetForm();
                    loadAdminNails();
                } else {
                    alert('Có lỗi xảy ra, vui lòng thử lại.');
                }
            } catch (error) {
                alert('Lỗi kết nối máy chủ.');
            } finally {
                btnSave.innerText = "Lưu Sản Phẩm";
                btnSave.disabled = false;
            }
        }

        // Đưa dữ liệu lên form để sửa
        function editNail(id) {
            const nail = allNails.find(n => n.id.toString() === id.toString());
            if (!nail) return;

            document.getElementById('edit-id').value = nail.id;
            document.getElementById('nail-name').value = nail.name;
            document.getElementById('nail-category').value = nail.category || 'Manikúra';
            document.getElementById('nail-price').value = nail.price;
            document.getElementById('nail-old-price').value = nail.oldPrice || '';

            document.getElementById('form-title').innerHTML = `<span>✏️</span> Sửa Mẫu Móng`;
            document.getElementById('btn-save').innerText = "Cập Nhật";
            document.getElementById('btn-cancel').classList.remove('hidden');

            // Hiển thị trước các ảnh hiện có trong sản phẩm
            let imgList = [];
            if (nail.images) {
                try { imgList = typeof nail.images === 'string' ? JSON.parse(nail.images) : nail.images; } catch(e){ imgList = [nail.img]; }
            } else {
                imgList = [nail.img];
            }

            const previewContainer = document.getElementById('preview-container');
            previewContainer.innerHTML = '';
            previewContainer.classList.remove('hidden');

            imgList.forEach(imgUrl => {
                const imgThumb = document.createElement('div');
                imgThumb.className = "relative w-16 h-16 rounded-lg overflow-hidden border border-gray-200 shadow-sm";
                imgThumb.innerHTML = `<img src="${imgUrl}" class="w-full h-full object-cover">`;
                previewContainer.appendChild(imgThumb);
            });

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Xóa sản phẩm
        async function deleteNail(id) {
            if (!confirm('Bạn có chắc chắn muốn xóa mẫu móng này không?')) return;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'delete', id: id })
                });
                alert('Đã xóa thành công!');
                loadAdminNails();
            } catch (error) {
                alert('Không thể xóa sản phẩm.');
            }
        }

        // Reset form về trạng thái thêm mới
        function resetForm() {
            document.getElementById('nail-form').reset();
            document.getElementById('edit-id').value = '';
            document.getElementById('form-title').innerHTML = `<span>➕</span> Thêm Mẫu Móng Mới`;
            document.getElementById('btn-save').innerText = "Lưu Sản Phẩm";
            document.getElementById('btn-cancel').classList.add('hidden');
            document.getElementById('preview-container').classList.add('hidden');
            document.getElementById('preview-container').innerHTML = '';
            base64Images = [];
        }

        // Khởi chạy khi tải trang
        loadAdminNails();
    </script>
</body>
</html>
