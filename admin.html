<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrace - Nehtové Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen py-10 relative">

    <div class="absolute right-4 top-4 flex space-x-2 items-center">
        <!-- Nút đăng xuất (hiện khi đã đăng nhập) -->
        <button onclick="logout()" id="logout-btn" class="hidden px-3 py-1 text-sm font-bold bg-red-500 text-white rounded hover:bg-red-600 transition">Odhlásit / Đăng xuất</button>
        <button onclick="changeAdminLang('cs')" id="admin-btn-cs" class="px-3 py-1 text-sm font-bold bg-pink-600 text-white rounded">CZ</button>
        <button onclick="changeAdminLang('vi')" id="admin-btn-vi" class="px-3 py-1 text-sm font-bold bg-gray-200 text-gray-700 rounded">VN</button>
    </div>

    <!-- KHUNG ĐĂNG NHẬP -->
    <div id="login-box" class="bg-white p-8 rounded-xl shadow-md w-96">
        <h2 id="login-title" class="text-2xl font-bold text-center mb-6 text-pink-600">🔐 Přihlášení Admin</h2>
        <div class="mb-4">
            <label id="pass-label" class="block text-gray-700 text-sm font-bold mb-2">Heslo:</label>
            <input type="password" id="password-input" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-500" placeholder="Zadejte heslo...">
        </div>
        <button onclick="checkLogin()" id="login-btn" class="w-full bg-pink-600 text-white font-bold py-2 rounded-lg hover:bg-pink-700 transition">Přihlásit se</button>
        <p id="error-msg" class="text-red-500 text-sm text-center mt-3 hidden">Nesprávné heslo!</p>
    </div>

    <!-- KHUNG QUẢN TRỊ -->
    <div id="admin-dashboard" class="hidden container mx-auto p-6 bg-white rounded-xl shadow-md max-w-2xl">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <h2 id="dash-title" class="text-2xl font-bold text-pink-600">✨ Správa Položek</h2>
            <a href="index.html" id="home-link" class="text-gray-500 text-sm hover:underline">Zpět na hlavní stránku</a>
        </div>

        <div class="bg-pink-50 p-4 rounded-lg mb-6">
            <h3 id="form-title" class="font-bold text-gray-700 mb-3">Přidat nový vzor / službu</h3>
            <input type="hidden" id="edit-id" value="">
            <input type="text" id="nail-name" placeholder="Název (např. Červené s kamínky)" class="w-full p-2 mb-3 border rounded bg-white">
            
            <div class="grid grid-cols-2 gap-2 mb-3">
                <input type="number" id="nail-price" min="0" placeholder="Cena (např. 500)" class="w-full p-2 border rounded bg-white">
                <input type="number" id="nail-old-price" min="0" placeholder="Původní cena (např. 600)" class="w-full p-2 border rounded bg-white">
            </div>
            
            <div class="mb-3">
                <label id="cat-label" class="block text-gray-600 text-sm font-semibold mb-1">Kategorie / Loại dịch vụ:</label>
                <div class="flex gap-2 mb-2">
                    <input type="text" id="nail-category" value="Manikúra" placeholder="Nhập hoặc chọn bên dưới..." class="w-full p-2 border rounded bg-white text-sm">
                </div>
                <div id="category-suggestions" class="flex flex-wrap gap-1.5">
                    <span class="text-xs text-gray-400">Načítání kategorií...</span>
                </div>
            </div>

            <div class="mb-3">
                <label id="file-label" class="block text-gray-600 text-sm font-semibold mb-1">Vybrat fotky (lze vybrat více):</label>
                <input type="file" id="nail-files" accept="image/*" multiple class="w-full p-2 border rounded bg-white text-sm">
                <p id="current-imgs-info" class="text-xs text-gray-500 mt-1 hidden">Đang có ảnh cũ, nếu chọn ảnh mới sẽ thay thế hoàn toàn.</p>
            </div>

            <div class="flex gap-2">
                <button onclick="saveNail()" id="save-btn" class="flex-1 bg-pink-600 text-white px-4 py-2 rounded font-bold hover:bg-pink-700 transition">Uložit do Google Sheets</button>
                <button onclick="resetForm()" id="cancel-edit-btn" class="hidden bg-gray-400 text-white px-4 py-2 rounded font-bold hover:bg-gray-500 transition">Hủy</button>
            </div>
        </div>

        <div>
            <h3 id="list-title" class="font-bold text-gray-700 mb-3">Aktuální seznam:</h3>
            <div id="admin-nail-list" class="space-y-4">
                <p id="admin-loading" class="text-gray-500">Načítání...</p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbzxcC8x3PAhtu-C_vR5Qxiv3LSRBZHLKAUvQSELPmhJOxqluAZ572ZcaNcuCO9m9dIP/exec';
        const IMGBB_API_KEY = 'ff6003803e7977c8212819c35faeb1d4';

        const adminTexts = {
            cs: {
                loginTitle: "🔐 Přihlášení Admin", passLabel: "Heslo:", loginBtn: "Přihlásit se",
                errorMsg: "Nesprávné heslo!", dashTitle: "✨ Správa Položek",
                homeLink: "Zpět na hlavní stránku", formTitleAdd: "Přidat nový vzor / službu", formTitleEdit: "Upravit položku",
                placeholderName: "Název (např. Červené s kamínky)", placeholderPrice: "Cena (např. 500)",
                placeholderOldPrice: "Původní cena (volitelně)", catLabel: "Kategorie (vyberte nebo napište vlastní):",
                fileLabel: "Vybrat fotky (lze vybrat více):", saveBtn: "Uložit do Google Sheets", updateBtn: "Aktualizovat položku",
                listTitle: "Aktuální seznam:", loading: "Načítání...", deleteBtn: "Smazat", editBtn: "Upravit",
                confirmDelete: "Opravdu chcete tuto položku smazat?", successAdd: "Položka byla úspěšně přidána!",
                successUpdate: "Položka byla úspěšně aktualizována!", uploading: "Nahrávání fotek..."
            },
            vi: {
                loginTitle: "🔐 Đăng Nhập Admin", passLabel: "Mật khẩu:", loginBtn: "Đăng Nhập",
                errorMsg: "Mật khẩu không đúng!", dashTitle: "✨ Quản Lý Dịch Vụ & Mẫu",
                homeLink: "Xem trang chủ", formTitleAdd: "Thêm mẫu / dịch vụ mới", formTitleEdit: "Chỉnh sửa mẫu / dịch vụ",
                placeholderName: "Tên (VD: Đỏ đính đá)", placeholderPrice: "Giá tiền (VD: 500)",
                placeholderOldPrice: "Giá cũ (Không bắt buộc)", catLabel: "Loại dịch vụ (chọn nhanh hoặc tự gõ):",
                fileLabel: "Chọn ảnh (có thể chọn nhiều ảnh):", saveBtn: "Lưu Lên Google Sheets", updateBtn: "Cập Nhật Thay Đổi",
                listTitle: "Danh sách hiện tại:", loading: "Đang tải...", deleteBtn: "Xóa", editBtn: "Sửa",
                confirmDelete: "Bạn có chắc muốn xóa mẫu này không?", successAdd: "Đã thêm thành công!",
                successUpdate: "Đã cập nhật thành công!", uploading: "Đang tải ảnh lên..."
            }
        };

        let currentAdminLang = localStorage.getItem('admin_lang') || 'cs';
        let cachedNails = [];
        let editingImages = [];

        // Tự động kiểm tra trạng thái đăng nhập khi vừa mở trang
        window.addEventListener('DOMContentLoaded', () => {
            const isLoggedIn = localStorage.getItem('admin_logged_in');
            if (isLoggedIn === 'true') {
                document.getElementById('login-box').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
                document.getElementById('logout-btn').classList.remove('hidden');
                loadAdminNails();
            }
            updateAdminTexts();
        });

        function changeAdminLang(lang) {
            currentAdminLang = lang;
            localStorage.setItem('admin_lang', lang);
            updateAdminTexts();
        }

        function updateAdminTexts() {
            const t = adminTexts[currentAdminLang];
            const safeSetText = (id, text) => {
                const el = document.getElementById(id);
                if (el) el.innerText = text;
            };

            safeSetText('login-title', t.loginTitle);
            safeSetText('pass-label', t.passLabel);
            safeSetText('login-btn', t.loginBtn);
            safeSetText('error-msg', t.errorMsg);
            safeSetText('dash-title', t.dashTitle);
            safeSetText('home-link', t.homeLink);
            
            const isEditing = document.getElementById('edit-id') && document.getElementById('edit-id').value !== '';
            safeSetText('form-title', isEditing ? t.formTitleEdit : t.formTitleAdd);
            safeSetText('save-btn', isEditing ? t.updateBtn : t.saveBtn);

            const nameInput = document.getElementById('nail-name');
            if (nameInput) nameInput.placeholder = t.placeholderName;

            const priceInput = document.getElementById('nail-price');
            if (priceInput) priceInput.placeholder = t.placeholderPrice;

            const oldPriceInput = document.getElementById('nail-old-price');
            if (oldPriceInput) oldPriceInput.placeholder = t.placeholderOldPrice;

            safeSetText('cat-label', t.catLabel);
            safeSetText('file-label', t.fileLabel);
            safeSetText('list-title', t.listTitle);
            safeSetText('admin-loading', t.loading);

            const btnCs = document.getElementById('admin-btn-cs');
            const btnVi = document.getElementById('admin-btn-vi');
            if (btnCs && btnVi) {
                if (currentAdminLang === 'cs') {
                    btnCs.className = "px-3 py-1 text-sm font-bold bg-pink-600 text-white rounded";
                    btnVi.className = "px-3 py-1 text-sm font-bold bg-gray-200 text-gray-700 rounded";
                } else {
                    btnVi.className = "px-3 py-1 text-sm font-bold bg-pink-600 text-white rounded";
                    btnCs.className = "px-3 py-1 text-sm font-bold bg-gray-200 text-gray-700 rounded";
                }
            }
        }

        // Gọi API lên Google Apps Script để kiểm tra mật khẩu bảo mật tuyệt đối
        async function checkLogin() {
            const pass = document.getElementById('password-input').value;
            const loginBtn = document.getElementById('login-btn');
            const originalText = loginBtn.innerText;
            loginBtn.innerText = "Checking...";
            loginBtn.disabled = true;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'login', password: pass })
                });

                const result = await response.json();

                if (result.status === 'success') {
                    localStorage.setItem('admin_logged_in', 'true');
                    document.getElementById('login-box').classList.add('hidden');
                    document.getElementById('admin-dashboard').classList.remove('hidden');
                    document.getElementById('logout-btn').classList.remove('hidden');
                    loadAdminNails();
                } else {
                    document.getElementById('error-msg').classList.remove('hidden');
                }
            } catch (error) {
                console.error("Lỗi đăng nhập:", error);
                alert("Lỗi kết nối máy chủ!");
            } finally {
                loginBtn.innerText = originalText;
                loginBtn.disabled = false;
            }
        }

        function logout() {
            localStorage.removeItem('admin_logged_in');
            location.reload();
        }

        async function loadAdminNails() {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'get' })
                });
                
                const textData = await response.text();
                let data;
                
                try {
                    data = JSON.parse(textData);
                } catch (e) {
                    data = [];
                }
                
                cachedNails = Array.isArray(data) ? data : [];

                renderCategorySuggestions();
                renderAdminNailListByCategory();
            } catch (error) {
                console.error("Lỗi kết nối:", error);
                cachedNails = [];
                renderCategorySuggestions();
                renderAdminNailListByCategory();
            }
        }

        function renderCategorySuggestions() {
            const container = document.getElementById('category-suggestions');
            if (!container) return;
            const categories = [...new Set(cachedNails.map(n => n.category || 'Manikúra'))];
            if (categories.length === 0) categories.push('Manikúra', 'Pedikúra');

            container.innerHTML = categories.map(cat => `
                <button type="button" onclick="selectCategory('${cat}')" class="px-3 py-1 text-xs font-semibold bg-white border border-pink-300 text-pink-600 rounded-full hover:bg-pink-100 transition shadow-sm">
                    + ${cat}
                </button>
            `).join('');
        }

        function selectCategory(cat) {
            document.getElementById('nail-category').value = cat;
        }

        function renderAdminNailListByCategory() {
            const list = document.getElementById('admin-nail-list');
            if (!list) return;
            const t = adminTexts[currentAdminLang];

            if (!cachedNails || cachedNails.length === 0) {
                list.innerHTML = '<p class="text-gray-500">Žádné položky.</p>';
                return;
            }

            const categories = [...new Set(cachedNails.map(n => n.category || 'Manikúra'))];
            let html = '';

            categories.forEach(cat => {
                const itemsInCat = cachedNails.filter(n => (n.category || 'Manikúra') === cat);

                html += `
                    <div class="bg-gray-50 p-3 rounded-lg border border-gray-200">
                        <div class="flex items-center justify-between mb-2 pb-1 border-b border-gray-200">
                            <span class="font-bold text-sm text-pink-600 flex items-center gap-1.5">
                                <span class="w-2 h-2 bg-pink-600 rounded-full inline-block"></span>
                                ${cat}
                            </span>
                            <span class="text-xs text-gray-500 font-medium">${itemsInCat.length} ${currentAdminLang === 'cs' ? 'položek' : 'mẫu'}</span>
                        </div>
                        <div class="space-y-2">
                `;

                itemsInCat.forEach(n => {
                    const hasDiscount = n.oldPrice && n.oldPrice.toString().trim() !== '';
                    let imgList = [];
                    if (n.images) {
                        try { imgList = typeof n.images === 'string' ? JSON.parse(n.images) : n.images; } catch(e){ imgList = [n.img]; }
                    } else {
                        imgList = [n.img];
                    }

                    html += `
                        <div class="flex items-center justify-between bg-white p-2.5 rounded border shadow-sm">
                            <div class="flex items-center space-x-3">
                                <img src="${imgList[0]}" class="w-12 h-12 object-cover rounded">
                                <div>
                                    <p class="font-bold text-sm">${n.name} <span class="text-xs text-gray-400 font-normal">(${imgList.length} ảnh)</span></p>
                                    <p class="text-xs text-pink-600 font-semibold">
                                        ${hasDiscount ? `<span class="line-through text-gray-400 mr-1">${n.oldPrice} Kč</span>` : ''}
                                        <span>${n.price} Kč</span>
                                    </p>
                                </div>
                            </div>
                            <div class="flex space-x-1">
                                <button onclick="startEdit('${n.id}')" class="text-blue-600 hover:underline text-xs font-semibold px-2 py-1">${t.editBtn}</button>
                                <button onclick="deleteNail('${n.id}')" class="text-red-600 hover:underline text-xs font-semibold px-2 py-1">${t.deleteBtn}</button>
                            </div>
                        </div>
                    `;
                });

                html += `</div></div>`;
            });

            list.innerHTML = html;
        }

        function startEdit(id) {
            const item = cachedNails.find(n => n.id === id);
            if (!item) return;

            document.getElementById('edit-id').value = item.id;
            document.getElementById('nail-name').value = item.name;
            document.getElementById('nail-price').value = item.price;
            document.getElementById('nail-old-price').value = item.oldPrice || '';
            document.getElementById('nail-category').value = item.category || 'Manikúra';
            
            if (item.images) {
                try { editingImages = typeof item.images === 'string' ? JSON.parse(item.images) : item.images; } catch(e){ editingImages = [item.img]; }
            } else {
                editingImages = [item.img];
            }

            document.getElementById('current-imgs-info').classList.remove('hidden');
            document.getElementById('cancel-edit-btn').classList.remove('hidden');
            updateAdminTexts();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('edit-id').value = '';
            document.getElementById('nail-name').value = '';
            document.getElementById('nail-price').value = '';
            document.getElementById('nail-old-price').value = '';
            document.getElementById('nail-files').value = '';
            document.getElementById('current-imgs-info').classList.add('hidden');
            document.getElementById('cancel-edit-btn').classList.add('hidden');
            editingImages = [];
            updateAdminTexts();
        }

        async function saveNail() {
            const editId = document.getElementById('edit-id').value;
            const name = document.getElementById('nail-name').value;
            const price = document.getElementById('nail-price').value;
            const oldPrice = document.getElementById('nail-old-price').value;
            const category = document.getElementById('nail-category').value || 'Manikúra';
            const fileInput = document.getElementById('nail-files');
            const t = adminTexts[currentAdminLang];

            if (!name || !price) {
                alert(currentAdminLang === 'cs' ? 'Vyplňte název a cenu!' : 'Vui lòng nhập tên và giá tiền!');
                return;
            }

            if (!editId && fileInput.files.length === 0) {
                alert(currentAdminLang === 'cs' ? 'Vyberte alespoň jednu fotku!' : 'Vui lòng chọn ít nhất một ảnh!');
                return;
            }

            const btn = document.getElementById('save-btn');
            btn.innerText = t.uploading;
            btn.disabled = true;

            try {
                let uploadedUrls = [...editingImages];

                if (fileInput.files.length > 0) {
                    uploadedUrls = [];
                    for (let i = 0; i < fileInput.files.length; i++) {
                        const formData = new FormData();
                        formData.append('image', fileInput.files[i]);

                        const imgbbRes = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                            method: 'POST',
                            body: formData
                        });
                        const imgbbData = await imgbbRes.json();
                        if (imgbbData.success) {
                            uploadedUrls.push(imgbbData.data.url);
                        }
                    }
                }

                if (uploadedUrls.length === 0) {
                    alert('Không có ảnh nào được tải lên thành công!');
                    btn.innerText = editId ? t.updateBtn : t.saveBtn;
                    btn.disabled = false;
                    return;
                }

                const nailData = {
                    id: editId ? editId : Date.now().toString(),
                    name: name,
                    price: price,
                    oldPrice: oldPrice || '',
                    img: uploadedUrls[0],
                    images: JSON.stringify(uploadedUrls),
                    category: category,
                    action: editId ? 'edit' : 'add'
                };

                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(nailData)
                });

                resetForm();
                loadAdminNails();
                alert(editId ? t.successUpdate : t.successAdd);

            } catch (error) {
                console.error(error);
                alert('Đã xảy ra lỗi kết nối!');
                btn.innerText = editId ? t.updateBtn : t.saveBtn;
                btn.disabled = false;
            }
        }

        async function deleteNail(id) {
            const t = adminTexts[currentAdminLang];
            if (!confirm(t.confirmDelete)) return;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'delete', id: id })
                });

                const result = await response.json();
                if (result.status === 'deleted' || result.status === 'success') {
                    loadAdminNails();
                } else {
                    alert('Không tìm thấy sản phẩm để xóa!');
                }
            } catch (error) {
                console.error(error);
                alert('Đã xảy ra lỗi khi xóa!');
            }
        }
    </script>
</body>
</html>
