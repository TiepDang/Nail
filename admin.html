<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrace - Nehtové Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen py-10 relative">

    <div class="absolute right-4 top-4 flex space-x-2">
        <button onclick="changeAdminLang('cs')" id="admin-btn-cs" class="px-3 py-1 text-sm font-bold bg-pink-600 text-white rounded">CZ</button>
        <button onclick="changeAdminLang('vi')" id="admin-btn-vi" class="px-3 py-1 text-sm font-bold bg-gray-200 text-gray-700 rounded">VN</button>
    </div>

    <!-- KHUNG ĐĂNG NHẬP -->
    <div id="login-box" class="bg-white p-8 rounded-xl shadow-md w-96">
        <h2 id="login-title" class="text-2xl font-bold text-center mb-6 text-pink-600">🔐 Přihlášení Admin</h2>
        <div class="mb-4">
            <label id="pass-label" class="block text-gray-700 text-sm font-bold mb-2">Heslo:</label>
            <input type="password" id="password-input" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-500" placeholder="Zadejte heslo...">
        </div>
        <button onclick="checkLogin()" id="login-btn" class="w-full bg-pink-600 text-white font-bold py-2 rounded-lg hover:bg-pink-700 transition">Přihlásit se</button>
        <p id="error-msg" class="text-red-500 text-sm text-center mt-3 hidden">Nesprávné heslo! (Tip: 12345)</p>
    </div>

    <!-- KHUNG QUẢN TRỊ -->
    <div id="admin-dashboard" class="hidden container mx-auto p-6 bg-white rounded-xl shadow-md max-w-2xl">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <h2 id="dash-title" class="text-2xl font-bold text-pink-600">✨ Správa Položek</h2>
            <a href="index.html" id="home-link" class="text-gray-500 text-sm hover:underline">Zpět na hlavní stránku</a>
        </div>

        <div class="bg-pink-50 p-4 rounded-lg mb-6">
            <h3 id="form-title" class="font-bold text-gray-700 mb-3">Přidat nový vzor / službu</h3>
            <input type="text" id="nail-name" placeholder="Název (např. Červené s kamínky)" class="w-full p-2 mb-3 border rounded">
            
            <!-- Đã đổi type="text" thành type="number" để chỉ nhập được số -->
            <div class="grid grid-cols-2 gap-2 mb-3">
                <input type="number" id="nail-price" min="0" placeholder="Cena (např. 500)" class="w-full p-2 border rounded">
                <input type="number" id="nail-old-price" min="0" placeholder="Původní cena (např. 600)" class="w-full p-2 border rounded">
            </div>
            
            <!-- Phần danh mục: Ô nhập + Gợi ý các mục đã có -->
            <div class="mb-3">
                <label id="cat-label" class="block text-gray-600 text-sm font-semibold mb-1">Kategorie / Loại dịch vụ:</label>
                <div class="flex gap-2 mb-2">
                    <input type="text" id="nail-category" value="Manikúra" placeholder="Nhập hoặc chọn bên dưới..." class="w-full p-2 border rounded bg-white text-sm">
                </div>
                <div id="category-suggestions" class="flex flex-wrap gap-1.5">
                    <span class="text-xs text-gray-400">Načítání kategorií...</span>
                </div>
            </div>

            <!-- Chọn file ảnh -->
            <div class="mb-3">
                <label id="file-label" class="block text-gray-600 text-sm font-semibold mb-1">Vybrat fotku:</label>
                <input type="file" id="nail-file" accept="image/*" class="w-full p-2 border rounded bg-white text-sm">
            </div>

            <button onclick="addNail()" id="save-btn" class="w-full bg-pink-600 text-white px-4 py-2 rounded font-bold hover:bg-pink-700 transition">Uložit do Google Sheets</button>
        </div>

        <div>
            <h3 id="list-title" class="font-bold text-gray-700 mb-3">Aktuální seznam:</h3>
            <div id="admin-nail-list" class="space-y-2">
                <p id="admin-loading" class="text-gray-500">Načítání...</p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbzxcC8x3PAhtu-C_vR5Qxiv3LSRBZHLKAUvQSELPmhJOxqluAZ572ZcaNcuCO9m9dIP/exec';
        const IMGBB_API_KEY = 'ff6003803e7977c8212819c35faeb1d4';

        const adminTexts = {
            cs: {
                loginTitle: "🔐 Přihlášení Admin",
                passLabel: "Heslo:",
                loginBtn: "Přihlásit se",
                errorMsg: "Nesprávné heslo! (Tip: 12345)",
                dashTitle: "✨ Správa Položek",
                homeLink: "Zpět na hlavní stránku",
                formTitle: "Přidat nový vzor / službu",
                placeholderName: "Název (např. Červené s kamínky)",
                placeholderPrice: "Cena (pouze číslo, např. 500)",
                placeholderOldPrice: "Původní cena (volitelně)",
                catLabel: "Kategorie (vyberte nebo napište vlastní):",
                fileLabel: "Vybrat fotku:",
                saveBtn: "Uložit do Google Sheets",
                listTitle: "Aktuální seznam:",
                loading: "Načítání...",
                deleteBtn: "Smazat",
                confirmDelete: "Opravdu chcete tuto položku smazat?",
                successAdd: "Položka byla úspěšně přidána!",
                uploading: "Nahrávání fotky..."
            },
            vi: {
                loginTitle: "🔐 Đăng Nhập Admin",
                passLabel: "Mật khẩu:",
                loginBtn: "Đăng Nhập",
                errorMsg: "Mật khẩu không đúng! (Gợi ý: 12345)",
                dashTitle: "✨ Quản Lý Dịch Vụ & Mẫu",
                homeLink: "Xem trang chủ",
                formTitle: "Thêm mẫu / dịch vụ mới",
                placeholderName: "Tên (VD: Đỏ đính đá)",
                placeholderPrice: "Giá tiền (Chỉ nhập số, VD: 500)",
                placeholderOldPrice: "Giá cũ (Không bắt buộc, VD: 600)",
                catLabel: "Loại dịch vụ (chọn nhanh hoặc tự gõ):",
                fileLabel: "Chọn ảnh từ thiết bị:",
                saveBtn: "Lưu Lên Google Sheets",
                listTitle: "Danh sách hiện tại:",
                loading: "Đang tải...",
                deleteBtn: "Xóa",
                confirmDelete: "Bạn có chắc muốn xóa mẫu này không?",
                successAdd: "Đã thêm thành công!",
                uploading: "Đang tải ảnh lên..."
            }
        };

        let currentAdminLang = localStorage.getItem('admin_lang') || 'cs';
        let cachedNails = [];

        function changeAdminLang(lang) {
            currentAdminLang = lang;
            localStorage.setItem('admin_lang', lang);
            updateAdminTexts();
        }

        function updateAdminTexts() {
            const t = adminTexts[currentAdminLang];
            document.getElementById('login-title').innerText = t.loginTitle;
            document.getElementById('pass-label').innerText = t.passLabel;
            document.getElementById('login-btn').innerText = t.loginBtn;
            document.getElementById('error-msg').innerText = t.errorMsg;
            document.getElementById('dash-title').innerText = t.dashTitle;
            document.getElementById('home-link').innerText = t.homeLink;
            document.getElementById('form-title').innerText = t.formTitle;
            document.getElementById('nail-name').placeholder = t.placeholderName;
            document.getElementById('nail-price').placeholder = t.placeholderPrice;
            document.getElementById('nail-old-price').placeholder = t.placeholderOldPrice;
            document.getElementById('cat-label').innerText = t.catLabel;
            document.getElementById('file-label').innerText = t.fileLabel;
            document.getElementById('save-btn').innerText = t.saveBtn;
            document.getElementById('list-title').innerText = t.listTitle;
            document.getElementById('admin-loading').innerText = t.loading;

            if (currentAdminLang === 'cs') {
                document.getElementById('admin-btn-cs').className = "px-3 py-1 text-sm font-bold bg-pink-600 text-white rounded";
                document.getElementById('admin-btn-vi').className = "px-3 py-1 text-sm font-bold bg-gray-200 text-gray-700 rounded";
            } else {
                document.getElementById('admin-btn-vi').className = "px-3 py-1 text-sm font-bold bg-pink-600 text-white rounded";
                document.getElementById('admin-btn-cs').className = "px-3 py-1 text-sm font-bold bg-gray-200 text-gray-700 rounded";
            }
        }

        function checkLogin() {
            const pass = document.getElementById('password-input').value;
            if (pass === '12345') {
                document.getElementById('login-box').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
                loadAdminNails();
            } else {
                document.getElementById('error-msg').classList.remove('hidden');
            }
        }

        async function loadAdminNails() {
            try {
                const response = await fetch(API_URL);
                cachedNails = await response.json();
                renderCategorySuggestions();
                renderNailListTable();
            } catch (error) {
                console.error(error);
            }
        }

        function renderCategorySuggestions() {
            const container = document.getElementById('category-suggestions');
            const categories = [...new Set(cachedNails.map(n => n.category || 'Manikúra'))];
            
            if (categories.length === 0) {
                categories.push('Manikúra', 'Pedikúra');
            }

            container.innerHTML = categories.map(cat => `
                <button type="button" onclick="selectCategory('${cat}')" class="px-3 py-1 text-xs font-semibold bg-white border border-pink-300 text-pink-600 rounded-full hover:bg-pink-100 transition shadow-sm">
                    + ${cat}
                </button>
            `).join('');
        }

        function selectCategory(cat) {
            document.getElementById('nail-category').value = cat;
        }

        function renderNailListTable() {
            const list = document.getElementById('admin-nail-list');
            const t = adminTexts[currentAdminLang];

            if (!cachedNails || cachedNails.length === 0) {
                list.innerHTML = '<p class="text-gray-500">Žádné položky.</p>';
                return;
            }

            list.innerHTML = cachedNails.map(n => `
                <div class="flex items-center justify-between bg-gray-50 p-3 rounded border">
                    <div class="flex items-center space-x-3">
                        <img src="${n.img}" class="w-12 h-12 object-cover rounded">
                        <div>
                            <p class="font-bold">${n.name} <span class="text-xs px-2 py-0.5 rounded bg-pink-100 text-pink-700">${n.category || 'Manikúra'}</span></p>
                            <p class="text-sm text-pink-600 font-semibold">${n.price} Kč ${n.oldPrice ? `<span class="line-through text-gray-400 text-xs ml-1">${n.oldPrice} Kč</span>` : ''}</p>
                        </div>
                    </div>
                    <button onclick="deleteNail('${n.id}')" class="text-red-600 hover:underline text-sm font-semibold">${t.deleteBtn}</button>
                </div>
            `).join('');
        }

        async function addNail() {
            const name = document.getElementById('nail-name').value;
            const price = document.getElementById('nail-price').value;
            const oldPrice = document.getElementById('nail-old-price').value;
            const category = document.getElementById('nail-category').value || 'Manikúra';
            const fileInput = document.getElementById('nail-file');
            const t = adminTexts[currentAdminLang];

            if (!name || !price || fileInput.files.length === 0) {
                alert(currentAdminLang === 'cs' ? 'Vyplňte název, cenu a vyberte fotku!' : 'Vui lòng nhập tên, giá tiền và chọn ảnh!');
                return;
            }

            const btn = document.getElementById('save-btn');
            btn.innerText = t.uploading;
            btn.disabled = true;

            try {
                const formData = new FormData();
                formData.append('image', fileInput.files[0]);

                const imgbbRes = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: 'POST',
                    body: formData
                });
                const imgbbData = await imgbbRes.json();

                if (!imgbbData.success) {
                    alert('Lỗi tải ảnh lên hệ thống!');
                    btn.innerText = t.saveBtn;
                    btn.disabled = false;
                    return;
                }

                const newNail = {
                    id: Date.now().toString(),
                    name: name,
                    price: price,
                    oldPrice: oldPrice || '',
                    img: imgbbData.data.url,
                    category: category
                };

                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(newNail)
                });

                document.getElementById('nail-name').value = '';
                document.getElementById('nail-price').value = '';
                document.getElementById('nail-old-price').value = '';
                fileInput.value = '';
                btn.innerText = t.saveBtn;
                btn.disabled = false;

                loadAdminNails();
                alert(t.successAdd);

            } catch (error) {
                console.error(error);
                alert('Đã xảy ra lỗi kết nối!');
                btn.innerText = t.saveBtn;
                btn.disabled = false;
            }
        }

        async function deleteNail(id) {
            const t = adminTexts[currentAdminLang];
            if (!confirm(t.confirmDelete)) return;

            await fetch(`${API_URL}?id=${id}`, {
                method: 'DELETE'
            });

            loadAdminNails();
        }

        updateAdminTexts();
    </script>
</body>
</html>
