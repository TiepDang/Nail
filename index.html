<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Nehtové Studio - Luxusní Nehty</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gradient-to-br from-pink-50 via-white to-pink-50 text-gray-800 min-h-screen flex flex-col justify-between">

    <!-- Header & Nút chuyển đổi ngôn ngữ -->
    <header class="bg-white/85 backdrop-blur-md shadow-sm sticky top-0 z-50 py-4 transition-all">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">🌸</span>
                <h1 id="shop-title" class="text-xl sm:text-2xl font-bold bg-gradient-to-r from-pink-600 to-rose-500 bg-clip-text text-transparent uppercase tracking-wider">Nehtové Studio</h1>
            </div>
            
            <div class="flex items-center space-x-3">
                <div class="flex bg-gray-100 p-1 rounded-full shadow-inner">
                    <button onclick="changeLanguage('cs')" id="btn-cs" class="px-3 py-1 text-xs font-bold bg-pink-600 text-white rounded-full transition shadow">CZ</button>
                    <button onclick="changeLanguage('vi')" id="btn-vi" class="px-3 py-1 text-xs font-bold text-gray-600 rounded-full transition hover:text-pink-600">VN</button>
                </div>
                <a href="admin.html" id="admin-link" class="hidden sm:inline-flex items-center text-xs font-semibold px-3 py-1.5 border border-pink-200 text-pink-600 rounded-full hover:bg-pink-50 transition">Admin</a>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="container mx-auto px-4 pt-10 pb-6 text-center">
        <div class="max-w-2xl mx-auto">
            <span id="badge-top" class="inline-block bg-pink-100 text-pink-700 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-widest mb-3 shadow-sm">✨ Premium Nail Art & Care</span>
            <h2 id="hero-heading" class="text-3xl sm:text-4xl font-extrabold text-gray-900 tracking-tight">Objevte svou krásu s námi</h2>
            <p id="shop-subtitle" class="text-gray-500 mt-2 text-sm sm:text-base">Profesionální design nehtů, luxusní gel a špičková péče.</p>
        </div>
    </section>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-6 flex-grow space-y-12">
        <div id="categories-container">
            <p id="loading-text" class="text-gray-400 text-center py-20 font-medium">Načítání galerie...</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-pink-100 py-8 text-center text-sm text-gray-500 mt-12">
        <div class="container mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <p>&copy; 2026 Nehtové Studio. All rights reserved.</p>
            <a href="admin.html" id="admin-link-footer" class="text-pink-600 font-semibold hover:underline">Administrace systému</a>
        </div>
    </footer>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbzxcC8x3PAhtu-C_vR5Qxiv3LSRBZHLKAUvQSELPmhJOxqluAZ572ZcaNcuCO9m9dIP/exec';
        let allNails = [];

        const translations = {
            cs: {
                title: "Nehtové Studio - Luxusní Nehty",
                shopTitle: "Nehtové Studio",
                badgeTop: "✨ Premium Nail Art & Care",
                heroHeading: "Objevte svou krásu s námi",
                shopSubtitle: "Profesionální design nehtů, luxusní gel a špičková péče.",
                loading: "Načítání galerie...",
                adminLink: "Admin",
                adminLinkFooter: "Administrace systému",
                error: "Nelze načíst data.",
                empty: "Žádné položky v systému."
            },
            vi: {
                title: "Tiệm Nails - Mẫu Móng Đẹp & Sang Trọng",
                shopTitle: "Tiệm Nails Xinh",
                badgeTop: "✨ Thiết Kế Móng Nghệ Thuật Cao Cấp",
                heroHeading: "Tôn vinh vẻ đẹp đôi bàn tay của bạn",
                shopSubtitle: "Chuyên thiết kế móng nghệ thuật, đính đá, gel cao cấp và chăm sóc tận tâm.",
                loading: "Đang tải bộ sưu tập...",
                adminLink: "Quản trị",
                adminLinkFooter: "Trang quản trị hệ thống",
                error: "Không thể tải dữ liệu từ máy chủ.",
                empty: "Chưa có mẫu nào trong hệ thống."
            }
        };

        let currentLang = localStorage.getItem('site_lang') || 'cs';

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('site_lang', lang);
            updateTexts();
            renderCategories();
        }

        function updateTexts() {
            const t = translations[currentLang];
            document.getElementById('page-title').innerText = t.title;
            document.getElementById('shop-title').innerText = t.shopTitle;
            document.getElementById('badge-top').innerText = t.badgeTop;
            document.getElementById('hero-heading').innerText = t.heroHeading;
            document.getElementById('shop-subtitle').innerText = t.shopSubtitle;
            document.getElementById('loading-text').innerText = t.loading;
            document.getElementById('admin-link').innerText = t.adminLink;
            document.getElementById('admin-link-footer').innerText = t.adminLinkFooter;

            if (currentLang === 'cs') {
                document.getElementById('btn-cs').className = "px-3 py-1 text-xs font-bold bg-pink-600 text-white rounded-full transition shadow";
                document.getElementById('btn-vi').className = "px-3 py-1 text-xs font-bold text-gray-600 rounded-full transition hover:text-pink-600";
            } else {
                document.getElementById('btn-vi').className = "px-3 py-1 text-xs font-bold bg-pink-600 text-white rounded-full transition shadow";
                document.getElementById('btn-cs').className = "px-3 py-1 text-xs font-bold text-gray-600 rounded-full transition hover:text-pink-600";
            }
        }

        async function loadPublicNails() {
            try {
                const response = await fetch(API_URL);
                allNails = await response.json();
                renderCategories();
            } catch (error) {
                document.getElementById('categories-container').innerHTML = `<p class="text-rose-500 text-center font-medium">${translations[currentLang].error}</p>`;
            }
        }

        function renderCategories() {
            const container = document.getElementById('categories-container');
            const t = translations[currentLang];

            if (!allNails || allNails.length === 0) {
                container.innerHTML = `<p class="text-gray-400 text-center py-20 font-medium">${t.empty}</p>`;
                return;
            }

            const categories = [...new Set(allNails.map(n => n.category || 'Manikúra'))];
            let html = '';

            categories.forEach(cat => {
                const itemsInCat = allNails.filter(n => (n.category || 'Manikúra') === cat);

                html += `
                    <div class="mb-10">
                        <div class="flex items-center justify-between mb-4 px-2">
                            <h3 class="text-2xl font-bold text-gray-800 flex items-center gap-2">
                                <span class="w-3 h-3 bg-pink-600 rounded-full inline-block"></span>
                                ${cat}
                            </h3>
                            <span class="text-xs font-semibold px-3 py-1 bg-pink-100 text-pink-700 rounded-full">
                                ${itemsInCat.length} ${currentLang === 'cs' ? 'položek' : 'mẫu'}
                            </span>
                        </div>

                        <div class="flex overflow-x-auto gap-5 pb-4 pt-1 no-scrollbar scroll-smooth">
                `;

                itemsInCat.forEach(n => {
                    // Kiểm tra xem có giá cũ hay không (oldPrice tồn tại và khác rỗng)
                    const hasDiscount = n.oldPrice && n.oldPrice.toString().trim() !== '';

                    html += `
                        <div class="min-w-[260px] max-w-[260px] bg-white rounded-2xl shadow-sm border border-pink-100/60 overflow-hidden hover:shadow-xl transition-all duration-300 flex flex-col flex-shrink-0 relative">
                            ${hasDiscount ? `<span class="absolute top-3 right-3 z-10 bg-rose-500 text-white text-[10px] font-extrabold px-2.5 py-1 rounded-full shadow-md uppercase tracking-wider">Sale</span>` : ''}
                            
                            <div class="w-full h-72 bg-neutral-900 flex items-center justify-center relative group overflow-hidden">
                                <img src="${n.img}" alt="${n.name}" class="w-full h-full object-contain group-hover:scale-105 transition duration-500">
                            </div>
                            <div class="p-4 flex flex-col flex-grow justify-between bg-white">
                                <div>
                                    <h4 class="font-bold text-base text-gray-800 truncate" title="${n.name}">${n.name}</h4>
                                </div>
                                <div class="mt-3 pt-3 border-t border-gray-100 flex items-center justify-between">
                                    <span class="text-xs text-gray-400 font-medium uppercase">Cena</span>
                                    <div class="text-right">
                                        <!-- Hiển thị giá cũ bị gạch ngang kèm chữ Kč, nếu có -->
                                        ${hasDiscount ? `<span class="line-through text-gray-400 text-xs mr-1.5">${n.oldPrice} Kč</span>` : ''}
                                        <!-- Hiển thị giá mới kèm chữ Kč -->
                                        <span class="text-pink-600 font-bold text-base">${n.price} Kč</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        updateTexts();
        loadPublicNails();
    </script>
</body>
</html>
