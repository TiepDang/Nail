<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Nehtové Studio - Luxusní Nehty</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-pink-50 text-gray-800 font-sans">

    <!-- Header & Nút chuyển đổi ngôn ngữ -->
    <header class="bg-white shadow-sm py-6 relative">
        <div class="absolute right-4 top-4 flex space-x-2">
            <button onclick="changeLanguage('cs')" id="btn-cs" class="px-3 py-1 text-sm font-bold bg-pink-600 text-white rounded">CZ</button>
            <button onclick="changeLanguage('vi')" id="btn-vi" class="px-3 py-1 text-sm font-bold bg-gray-200 text-gray-700 rounded">VN</button>
        </div>
        <div class="container mx-auto px-4 text-center">
            <h1 id="shop-title" class="text-3xl font-bold text-pink-600 uppercase tracking-wider">🌸 Nehtové Studio 🌸</h1>
            <p id="shop-subtitle" class="text-gray-500 mt-2">Profesionální design nehtů, luxusní gel a kamínky</p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-10">
        <h2 id="section-heading" class="text-2xl font-semibold mb-6 text-gray-700 border-b pb-2">✨ Galerie Nehtů</h2>
        
        <div id="nail-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <p id="loading-text" class="text-gray-500 col-span-full text-center">Načítání galerie...</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t py-6 text-center text-sm text-gray-500 mt-10">
        <p>&copy; 2026 Nehtové Studio. All rights reserved. | <a href="admin.html" id="admin-link" class="text-pink-600 underline">Administrace</a></p>
    </footer>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbxkzU3F2k3wO2A8XOJhifZW3c-vkc9UrKQFVe8KkbPkVkdnuOXcdLJeKeQDQDbZMgbc/exec';

        const translations = {
            cs: {
                title: "Nehtové Studio - Luxusní Nehty",
                shopTitle: "🌸 Nehtové Studio 🌸",
                shopSubtitle: "Profesionální design nehtů, luxusní gel a kamínky",
                sectionHeading: "✨ Galerie Nehtů",
                loading: "Načítání galerie...",
                adminLink: "Administrace",
                error: "Nelze načíst data."
            },
            vi: {
                title: "Tiệm Nails - Mẫu Móng Đẹp & Sang Trọng",
                shopTitle: "🌸 Tiệm Nails Xinh 🌸",
                shopSubtitle: "Chuyên thiết kế móng nghệ thuật, đính đá, gel cao cấp",
                sectionHeading: "✨ Bộ Sưu Tập Mẫu Móng",
                loading: "Đang tải danh sách mẫu móng...",
                adminLink: "Quản trị viên",
                error: "Không thể tải dữ liệu mẫu móng."
            }
        };

        let currentLang = localStorage.getItem('site_lang') || 'cs';

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('site_lang', lang);
            updateTexts();
        }

        function updateTexts() {
            const t = translations[currentLang];
            document.getElementById('page-title').innerText = t.title;
            document.getElementById('shop-title').innerText = t.shopTitle;
            document.getElementById('shop-subtitle').innerText = t.shopSubtitle;
            document.getElementById('section-heading').innerText = t.sectionHeading;
            document.getElementById('loading-text').innerText = t.loading;
            document.getElementById('admin-link').innerText = t.adminLink;

            if (currentLang === 'cs') {
                document.getElementById('btn-cs').className = "px-3 py-1 text-sm font-bold bg-pink-600 text-white rounded";
                document.getElementById('btn-vi').className = "px-3 py-1 text-sm font-bold bg-gray-200 text-gray-700 rounded";
            } else {
                document.getElementById('btn-vi').className = "px-3 py-1 text-sm font-bold bg-pink-600 text-white rounded";
                document.getElementById('btn-cs').className = "px-3 py-1 text-sm font-bold bg-gray-200 text-gray-700 rounded";
            }
        }

        async function loadPublicNails() {
            try {
                const response = await fetch(API_URL);
                const nails = await response.json();
                const listContainer = document.getElementById('nail-list');

                if (!nails || nails.length === 0) {
                    listContainer.innerHTML = '<p class="text-gray-500 col-span-full text-center">Žádné vzory nehtů.</p>';
                    return;
                }

                listContainer.innerHTML = nails.map(n => `
                    <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-lg transition">
                        <img src="${n.img}" alt="${n.name}" class="w-full h-48 object-cover">
                        <div class="p-4">
                            <h3 class="font-bold text-lg text-gray-800">${n.name}</h3>
                            <p class="text-pink-600 font-semibold mt-1">${n.price}</p>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                document.getElementById('nail-list').innerHTML = `<p class="text-red-500 col-span-full text-center">${translations[currentLang].error}</p>`;
            }
        }

        updateTexts();
        loadPublicNails();
    </script>
</body>
</html>
