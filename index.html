<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Nehtové Studio & Česká Slovní Zásoba</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #fff5f7; color: #333; line-height: 1.6; }
        
        /* Language Bar */
        .lang-bar { display: flex; justify-content: flex-end; padding: 10px 20px; background: #fff; border-bottom: 1px solid #eee; }
        .lang-btn { background: #fff; border: 1px solid #ffb6c1; padding: 5px 12px; margin-left: 5px; cursor: pointer; border-radius: 4px; font-weight: bold; color: #d81b60; transition: 0.2s; }
        .lang-btn.active, .lang-btn:hover { background: #ffb6c1; color: #fff; }

        /* Header & Hero */
        .hero { background: linear-gradient(135deg, #ff758c, #ff7eb3); color: white; text-align: center; padding: 30px 20px; }
        .hero h1 { font-size: 1.8rem; margin-bottom: 10px; }
        .hero p { font-size: 0.95rem; opacity: 0.9; }

        /* Container */
        .container { max-width: 600px; margin: 20px auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        /* Tabs navigation */
        .tabs { display: flex; justify-content: center; margin-bottom: 20px; border-bottom: 2px solid #ffedf0; }
        .tab-btn { background: none; border: none; padding: 10px 20px; font-size: 1rem; font-weight: bold; cursor: pointer; color: #888; border-bottom: 3px solid transparent; margin-bottom: -2px; }
        .tab-btn.active { color: #d81b60; border-bottom-color: #d81b60; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Form Groups */
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #555; font-size: 0.9rem; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; outline: none; transition: border-color 0.2s; }
        input:focus, select:focus, textarea:focus { border-color: #ff758c; }
        textarea { resize: vertical; height: 80px; }

        /* Submit Button */
        .btn-submit { background: #d81b60; color: white; border: none; width: 100%; padding: 14px; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        .btn-submit:hover { background: #ad1457; }

        /* Vocabulary Section */
        .vocab-search { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; }
        .vocab-list { max-height: 350px; overflow-y: auto; border: 1px solid #eee; border-radius: 8px; }
        .vocab-item { padding: 10px 15px; border-bottom: 1px solid #f5f5f5; display: flex; justify-content: space-between; }
        .vocab-item:last-child { border-bottom: none; }
        .vocab-cs { font-weight: bold; color: #d81b60; }
        .vocab-vi { color: #666; }

        /* Footer */
        .footer { text-align: center; margin-top: 20px; font-size: 0.85rem; color: #888; }
    </style>
</head>
<body>

    <!-- Thanh chọn ngôn ngữ -->
    <div class="lang-bar">
        <button class="lang-btn active" onclick="setLanguage('cs')">CS</button>
        <button class="lang-btn" onclick="setLanguage('vi')">VN</button>
    </div>

    <!-- Tiêu đề trang -->
    <div class="hero">
        <h1 id="t_mainTitle">Nehtové Studio & Česká Slovní Zásoba</h1>
        <p id="t_subTitle">Online rezervace a výuka češtiny</p>
    </div>

    <div class="container">
        <!-- Chuyển đổi giữa 2 tính năng: Đặt lịch & Từ vựng tiếng Séc -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('booking')" id="t_tabBooking">📅 Đặt lịch hẹn</button>
            <button class="tab-btn" onclick="switchTab('vocab')" id="t_tabVocab">📚 Từ vựng Séc (1000 từ)</button>
        </div>

        <!-- Tab 1: Đặt lịch hẹn -->
        <div id="tab-booking" class="tab-content active">
            <div class="form-group">
                <label id="t_labelName">Họ và tên / Jméno:</label>
                <input type="text" id="txtName" placeholder="Zadejte své jméno...">
            </div>

            <div class="form-group">
                <label id="t_labelPhone">Số điện thoại / Telefon:</label>
                <input type="tel" id="txtPhone" placeholder="Zadejte telefon...">
            </div>

            <div class="form-group">
                <label id="t_labelDate">Ngày hẹn / Datum:</label>
                <input type="date" id="txtDate">
            </div>

            <div class="form-group">
                <label id="t_labelTime">Giờ hẹn / Čas:</label>
                <select id="txtTime">
                    <option value="09:00">09:00</option>
                    <option value="10:00">10:00</option>
                    <option value="11:00">11:00</option>
                    <option value="12:00">12:00</option>
                    <option value="13:00">13:00</option>
                    <option value="14:00">14:00</option>
                    <option value="15:00">15:00</option>
                    <option value="16:00">16:00</option>
                    <option value="17:00">17:00</option>
                    <option value="18:00">18:00</option>
                </select>
            </div>

            <div class="form-group">
                <label id="t_labelService">Dịch vụ / Služba:</label>
                <select id="selService">
                    <option value="Modeláž nehtů (Gelové nehty)">Modeláž nehtů (Gelové nehty)</option>
                    <option value="Manikúra + Gel lak (Shellac)">Manikúra + Gel lak (Shellac)</option>
                    <option value="Pedikúra">Pedikúra</option>
                    <option value="Doplnění nehtů">Doplnění nehtů</option>
                </select>
            </div>

            <div class="form-group">
                <label id="t_labelNote">Ghi chú thêm / Poznámka:</label>
                <textarea id="txtNote" placeholder="Např. barva, design..."></textarea>
            </div>

            <button class="btn-submit" id="t_btnSubmit" onclick="bookAppointment()">Gửi lịch hẹn qua Facebook</button>
        </div>

        <!-- Tab 2: Học từ vựng tiếng Séc -->
        <div id="tab-vocab" class="tab-content">
            <input type="text" id="searchVocab" class="vocab-search" placeholder="Hledat slovo / Tìm kiếm từ vựng..." onkeyup="filterVocab()">
            <div class="vocab-list" id="vocabListContainer">
                <!-- Danh sách từ vựng mẫu, bạn có thể bổ sung thêm -->
                <div class="vocab-item"><span class="vocab-cs">Ahoj</span><span class="vocab-vi">Xin chào / Tạm biệt</span></div>
                <div class="vocab-item"><span class="vocab-cs">Děkuji</span><span class="vocab-vi">Cảm ơn</span></div>
                <div class="vocab-item"><span class="vocab-cs">Prosím</span><span class="vocab-vi">Làm ơn / Xin mời</span></div>
                <div class="vocab-item"><span class="vocab-cs">Nehty</span><span class="vocab-vi">Móng tay</span></div>
                <div class="vocab-item"><span class="vocab-cs">Salon</span><span class="vocab-vi">Tiệm / Salon</span></div>
                <div class="vocab-item"><span class="vocab-cs">Barva</span><span class="vocab-vi">Màu sắc</span></div>
                <div class="vocab-item"><span class="vocab-cs">Krásný</span><span class="vocab-vi">Đẹp</span></div>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>&copy; 2026 Nehtové Studio & Czech Learning. All rights reserved.</p>
    </div>

    <script>
        // Dữ liệu song ngữ
        const langData = {
            cs: {
                pageTitle: "Nehtové Studio & Česká Slovní Zásoba",
                mainTitle: "Nehtové Studio & Česká Slovní Zásoba",
                subTitle: "Online rezervace a výuka češtiny",
                tabBooking: "📅 Rezervace",
                tabVocab: "📚 Slovní zásoba",
                labelName: "Jméno a příjmení:",
                labelPhone: "Telefonní číslo:",
                labelDate: "Datum:",
                labelTime: "Čas:",
                labelService: "Služba:",
                labelNote: "Poznámka:",
                btnSubmit: "Odeslat rezervaci na Facebook",
                alertError: "Vyplňte prosím jméno, telefon a datum!"
            },
            vi: {
                pageTitle: "Tiệm Nail & Học Tiếng Séc",
                mainTitle: "Tiệm Nail & Từ Vựng Tiếng Séc",
                subTitle: "Đặt lịch trực tuyến kết hợp học từ vựng phổ biến",
                tabBooking: "📅 Đặt lịch hẹn",
                tabVocab: "📚 Từ vựng Séc",
                labelName: "Họ và tên:",
                labelPhone: "Số điện thoại:",
                labelDate: "Ngày hẹn:",
                labelTime: "Giờ hẹn:",
                labelService: "Dịch vụ lựa chọn:",
                labelNote: "Ghi chú thêm:",
                btnSubmit: "Gửi lịch hẹn qua Facebook",
                alertError: "Vui lòng nhập đầy đủ Tên, Số điện thoại và Ngày hẹn!"
            }
        };

        let currentLang = 'cs';

        function setLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            document.getElementById('pageTitle').innerText = langData[lang].pageTitle;
            document.getElementById('t_mainTitle').innerText = langData[lang].mainTitle;
            document.getElementById('t_subTitle').innerText = langData[lang].subTitle;
            document.getElementById('t_tabBooking').innerText = langData[lang].tabBooking;
            document.getElementById('t_tabVocab').innerText = langData[lang].tabVocab;
            document.getElementById('t_labelName').innerText = langData[lang].labelName;
            document.getElementById('t_labelPhone').innerText = langData[lang].labelPhone;
            document.getElementById('t_labelDate').innerText = langData[lang].labelDate;
            document.getElementById('t_labelTime').innerText = langData[lang].labelTime;
            document.getElementById('t_labelService').innerText = langData[lang].labelService;
            document.getElementById('t_labelNote').innerText = langData[lang].labelNote;
            document.getElementById('t_btnSubmit').innerText = langData[lang].btnSubmit;
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (tabName === 'booking') {
                document.getElementById('t_tabBooking').classList.add('active');
                document.getElementById('tab-booking').classList.add('active');
            } else {
                document.getElementById('t_tabVocab').classList.add('active');
                document.getElementById('tab-vocab').classList.add('active');
            }
        }

        function filterVocab() {
            let input = document.getElementById('searchVocab').value.toLowerCase();
            let items = document.getElementsByClassName('vocab-item');
            for (let i = 0; i < items.length; i++) {
                let text = items[i].innerText.toLowerCase();
                items[i].style.display = text.includes(input) ? "" : "none";
            }
        }

        function bookAppointment() {
            const name = document.getElementById('txtName').value.trim();
            const phone = document.getElementById('txtPhone').value.trim();
            const date = document.getElementById('txtDate').value;
            const time = document.getElementById('txtTime').value;
            const service = document.getElementById('selService').value;
            const note = document.getElementById('txtNote').value.trim();
            const t = langData[currentLang];

            if (!name || !phone || !date) {
                alert(t.alertError);
                return;
            }

            const fbUsername = "Tiepdang.2k"; 
            
            const message = `🌸 LỊCH HẸN MỚI TỪ WEBSITE 🌸\n\n` +
                            `- Khách hàng: ${name}\n` +
                            `- Số điện thoại: ${phone}\n` +
                            `- Ngày hẹn: ${date} lúc ${time}\n` +
                            `- Dịch vụ: ${service}\n` +
                            `- Ghi chú: ${note || "Không có"}`;
            
            const encodedMessage = encodeURIComponent(message);
            window.open(`https://m.me/${fbUsername}?text=${encodedMessage}`, '_blank');
        }
    </script>
</body>
</html>
